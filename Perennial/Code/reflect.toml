# reflect: a whole-package Go model (goose/model/overlay/reflect), rewritten from the real files,
# over the reflection primitives of internal/reflectcore. Every model declaration is translated,
# except the names-only ones: unmodelled.go (generated by goose/model/overlaytools/unmodelled,
# which also writes names_only below) declares the rest of the real API with gomodel.Stuck()
# bodies; makeMethodValue and valueMethodName are names-only too.
translate = ["!*"]
imports = ["internal/gomodel", "internal/reflectcore", "iter", "strconv", "unsafe"]

[model]
dir = "goose/model/overlay/reflect"
replaces = ["*"]
names_only = [
  "makeMethodValue", "valueMethodName", "DeepEqual", "Value.Seq", "Value.Seq2", "MakeFunc",
  "rtype.Key", "MapOf", "Value.MapIndex", "Value.MapKeys", "MapIter", "MapIter.Key",
  "Value.SetIterKey", "MapIter.Value", "Value.SetIterValue", "MapIter.Next",
  "MapIter.Reset", "Value.MapRange", "Value.SetMapIndex", "Swapper", "Method",
  "Method.IsExported", "rtype.String", "rtype.Size", "rtype.Bits", "rtype.Align",
  "rtype.FieldAlign", "rtype.NumMethod", "rtype.Method", "rtype.MethodByName",
  "rtype.PkgPath", "rtype.Name", "rtype.ChanDir", "rtype.Field", "rtype.FieldByIndex",
  "rtype.FieldByName", "rtype.FieldByNameFunc", "rtype.Len", "rtype.NumField", "rtype.In",
  "rtype.NumIn", "rtype.NumOut", "rtype.Out", "rtype.IsVariadic", "rtype.OverflowComplex",
  "rtype.OverflowFloat", "rtype.OverflowInt", "rtype.OverflowUint", "rtype.CanSeq",
  "rtype.CanSeq2", "rtype.Fields", "rtype.Methods", "rtype.Ins", "rtype.Outs",
  "StructField", "StructField.IsExported", "StructTag", "StructTag.Get", "StructTag.Lookup",
  "TypeFor", "PtrTo", "PointerTo", "rtype.Implements", "rtype.AssignableTo",
  "rtype.ConvertibleTo", "rtype.Comparable", "ChanOf", "FuncOf", "SliceOf", "StructOf",
  "ArrayOf", "Value.Addr", "Value.Bool", "Value.Bytes", "Value.Call", "Value.CallSlice",
  "Value.Cap", "Value.Close", "Value.CanComplex", "Value.Complex", "Value.Field",
  "Value.FieldByIndex", "Value.FieldByIndexErr", "Value.FieldByName",
  "Value.FieldByNameFunc", "Value.CanFloat", "Value.Float", "Value.Index", "Value.CanInt",
  "Value.Int", "TypeAssert", "Value.InterfaceData", "Value.IsZero", "Value.SetZero",
  "Value.Len", "Value.Method", "Value.NumMethod", "Value.MethodByName", "Value.NumField",
  "Value.OverflowComplex", "Value.OverflowFloat", "Value.OverflowInt", "Value.OverflowUint",
  "Value.Pointer", "Value.Recv", "Value.Send", "Value.Set", "Value.SetBool",
  "Value.SetBytes", "Value.SetComplex", "Value.SetFloat", "Value.SetInt", "Value.SetLen",
  "Value.SetCap", "Value.SetUint", "Value.SetPointer", "Value.SetString", "Value.Slice",
  "Value.Slice3", "Value.String", "Value.TryRecv", "Value.TrySend", "Value.CanUint",
  "Value.Uint", "Value.UnsafeAddr", "Value.UnsafePointer", "Value.Fields", "Value.Methods",
  "StringHeader", "SliceHeader", "Value.Grow", "Value.Clear", "Append", "AppendSlice",
  "Copy", "SelectDir", "SelectCase", "Select", "MakeSlice", "SliceAt", "MakeChan",
  "MakeMap", "MakeMapWithSize", "Zero", "New", "NewAt", "Value.Convert", "Value.CanConvert",
  "Value.Comparable", "Value.Equal", "VisibleFields",
]
