translate = ["!*", "Version", "Callers", "CallersFrames"]

imports = ["!*", "internal/runtime/atomic", "internal/runtime/sys", "internal/gomodel"]

# translate the definitions of all type declarations goose supports
translate_types = true

# The Go model (goose/model/overlay/runtime): each declaration's MODEL: comment says why it has at
# least Go's behaviours. `Gosched` (`mcall(gosched_m)`: assembly and the scheduler); `buildVersion`,
# which `Version` returns and the linker sets (an arbitrary string); `callers`, the stack walk
# `Callers` calls (`getg`, `sys.GetCallerPC`: compiler intrinsics; arbitrary words), and
# `Frames.Next`, the symbolization of program counters (the binary's tables; arbitrary frames).
[model]
dir = "goose/model/overlay/runtime"
replaces = ["Gosched", "buildVersion", "callers", "Frames.Next"]
