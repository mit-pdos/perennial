# The real type Mutex and the constant its model uses are translated; Lock, TryLock, Unlock and fatal
# are the Go model (goose/model/overlay/internal/sync; each MODEL: comment says why it has at least
# Go's behaviours). The rest of the package (lockSlow, unlockSlow, HashTrieMap) is not translated.
translate = ["!*", "Mutex", "mutexLocked"]

imports = ["!*", "sync/atomic", "internal/gomodel"]

[model]
dir = "goose/model/overlay/internal/sync"
replaces = ["Mutex.Lock", "Mutex.TryLock", "Mutex.Unlock", "fatal"]
