# `IndexByte`, `Index`, `Cut`: strings.IndexByte and strings.Cut; they call internal/bytealg's
# `IndexByteString` and `IndexString`, translated from their Go models (Code/internal/bytealg.toml)
translate = ["!*", "Clone", "HasPrefix", "HasSuffix", "TrimPrefix", "TrimSuffix", "IndexByte", "Index", "Cut"]
imports = ["!*", "internal/bytealg"]

# translate the definitions of all type declarations goose supports
translate_types = true

# `Clone` ends in `unsafe.String`, which goose does not translate: a Go model
# (goose/model/overlay/internal/stringslite) with `string(b)` in its place.
[model]
dir = "goose/model/overlay/internal/stringslite"
replaces = ["Clone"]
