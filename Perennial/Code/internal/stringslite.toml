translate = ["!*", "HasPrefix", "HasSuffix", "TrimPrefix", "TrimSuffix"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true

# `Clone` ends in `unsafe.String`, which goose does not translate: a Go model
# (goose/model/overlay/internal/stringslite) with `string(b)` in its place.
[model]
dir = "goose/model/overlay/internal/stringslite"
replaces = ["Clone"]
