# The plain Go that `strings` and `internal/stringslite` use is goose's translation of the real
# source.
translate = [
  "MaxLen", "MaxBruteForce", "PrimeRK",
  "Cutover", "HashStr", "IndexRabinKarp", "CompareString",
]
# Trusted models in TrustedCode/internal/bytealg.lean, of what has no Go body or reads the CPU:
# - `MakeNoZero` is implemented in the runtime (linkname);
# - `IndexByteString`, `IndexString`, `CountString` and `abigen_runtime_cmpstring` are assembly;
# - `init.0` sets `MaxLen` from `cpu.X86.HasAVX2`, which the runtime sets from `cpuid` before
#   any package is initialized.
trusted = [
  "MakeNoZero", "IndexByteString", "IndexString", "CountString", "abigen_runtime_cmpstring",
  "init.0",
]
imports = ["!*"]
