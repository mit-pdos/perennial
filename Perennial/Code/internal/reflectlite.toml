# internal/reflectlite: a whole-package Go model (goose/model/overlay/internal/reflectlite),
# rewritten from the real files over the reflection primitives of internal/reflectcore, as the
# model of reflect is. Every model declaration is translated, except the names-only ones:
# unmodelled.go (generated by goose/model/overlaytools/unmodelled, which also writes names_only
# below) declares the rest of the real API with gomodel.Stuck() bodies; methodName is names-only
# too.
translate = ["!*"]
imports = ["internal/abi", "internal/gomodel", "internal/reflectcore"]

[model]
dir = "goose/model/overlay/internal/reflectlite"
replaces = ["*"]
names_only = [
  "rtype.Size", "methodName", "Swapper", "rtype.String", "rtype.NumMethod", "rtype.PkgPath",
  "rtype.Name", "rtype.In", "rtype.Key", "rtype.Len", "rtype.NumField", "rtype.NumIn",
  "rtype.NumOut", "rtype.Out", "rtype.Comparable", "Value.Len",
]
