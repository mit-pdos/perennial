# internal/reflectlite: a whole-package Go model (goose/model/overlay/internal/reflectlite),
# rewritten from the real files over the reflection primitives of internal/reflectcore, as the
# model of reflect is. translate excludes the declarations the model does not model, which goose
# translates names-only: unmodelled.go's (the rest of the real API, with gomodel.Stuck() bodies)
# and the model functions whose body is gomodel.Stuck() (methodName).
# goose/model/overlaytools/unmodelled generates unmodelled.go and writes translate:
#   go run ./goose/model/overlaytools/unmodelled -pkg internal/reflectlite \
#     -model goose/model/overlay/internal/reflectlite -methods-of rtype \
#     -toml Perennial/Code/internal/reflectlite.toml
translate = [
  "*",
  "!rtype.Size", "!methodName", "!Swapper", "!rtype.String", "!rtype.NumMethod",
  "!rtype.PkgPath", "!rtype.Name", "!rtype.In", "!rtype.Key", "!rtype.Len",
  "!rtype.NumField", "!rtype.NumIn", "!rtype.NumOut", "!rtype.Out", "!rtype.Comparable",
  "!Value.Len",
]
imports = ["internal/abi", "internal/gomodel", "internal/reflectcore"]

[model]
dir = "goose/model/overlay/internal/reflectlite"
replaces = ["*"]
