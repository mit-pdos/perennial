# Only NoEscape (strings.Builder's copyCheck). It hides a pointer from escape analysis by a
# round trip through uintptr, `unsafe.Pointer(uintptr(p) ^ 0)`; the semantics has no rule for
# `unsafe.Pointer` of a `uintptr` (gc moves stacks), so goose's translation is stuck and NoEscape is
# trusted (TrustedCode/internal/abi.lean).
# the package's initializer: `kindNames` (a []string literal keyed by the Kind constants)
translate = [
  "kindNames", "Kind",
  "Invalid", "Bool", "Int", "Int8", "Int16", "Int32", "Int64", "Uint", "Uint8", "Uint16",
  "Uint32", "Uint64", "Uintptr", "Float32", "Float64", "Complex64", "Complex128", "Array", "Chan",
  "Func", "Interface", "Map", "Pointer", "Slice", "String", "Struct", "UnsafePointer",
]
imports = ["!*"]
trusted = ["NoEscape"]
