# The package's functions over the network, files and clocks are trusted models in terms of the
# Grove extension (Perennial/TrustedCode/github_com/mit_pdos/gokv/grove_ffi.lean); its types are
# translated. Nothing else is translated.
translate = ["Listener", "Connection", "Address", "ConnectRet", "ReceiveRet"]
imports = ["!*"]
trusted = [
  "Listen", "Connect", "Accept", "Send", "Receive",
  "FileRead", "FileWrite", "FileAppend", "GetTSC", "GetTimeRange",
]
