translate = [
  "!*",
  # Mutex forwards to internal/sync.Mutex, whose methods are modelled
  "Mutex",
  "Mutex.*",
  "rwmutexMaxReaders",
  "RWMutex",
  "RWMutex.*",

  "WaitGroup",
  "WaitGroup.*",
  "waitGroupBubbleFlag",
  "noCopy",
  "rlocker",
  "rlocker.*",
  "Once",
  "Once.*",
  "OnceFunc",
  "OnceValue",
  "OnceValues",
  "Cond",
  "Cond.*",
  "NewCond",
  "Locker",


  "init.0",
  "init.1",
  # the declarations the model replaces (its Go, translated)
  "Pool.Get", "Pool.Put", "runtime_Semacquire", "runtime_SemacquireRWMutex", "runtime_SemacquireRWMutexR", "runtime_SemacquireWaitGroup", "runtime_Semrelease", "runtime_notifyListAdd", "runtime_notifyListCheck", "runtime_notifyListNotifyAll", "runtime_notifyListNotifyOne", "runtime_notifyListWait", "runtime_registerPoolCleanup",
  # the model's own helpers
  "poolModelOf"]

imports = ["sync/atomic", "internal/race", "internal/synctest", "internal/sync", "internal/gomodel"]

# The Go model (goose/model/overlay/sync): each declaration's MODEL: comment says why it has at least
# Go's behaviours. The runtime hooks (`runtime_Semacquire*`, `runtime_Semrelease`, `runtime_notifyList*`,
# `runtime_registerPoolCleanup`: no Go body, defined by the runtime's push linknames) and
# `Pool.Get`/`Put` (per-P pools reached by pointer arithmetic). `poolModelAt` is a primitive stub
# (TrustedCode/sync.lean).
trusted = [
  "poolModelAt",
  # `copyChecker` is a `uintptr` holding its own address, and `check` converts `unsafe.Pointer(c)` to
  # `uintptr` and CASes it; the semantics has neither conversion, so both are modelled in
  # TrustedCode/sync.lean (as an `unsafe.Pointer`). A Go model would change an unexported type's
  # kind, which the overlay's API check refuses (follow-up).
  "copyChecker",
  "copyChecker.*",
]

# translate the definitions of all type declarations goose supports
translate_types = true

[model]
dir = "goose/model/overlay/sync"
replaces = [
  "runtime_Semacquire", "runtime_SemacquireWaitGroup", "runtime_SemacquireRWMutexR",
  "runtime_SemacquireRWMutex", "runtime_Semrelease",
  "runtime_notifyListAdd", "runtime_notifyListWait", "runtime_notifyListNotifyAll",
  "runtime_notifyListNotifyOne", "runtime_notifyListCheck",
  "runtime_registerPoolCleanup",
  "Pool.Get", "Pool.Put",
]
