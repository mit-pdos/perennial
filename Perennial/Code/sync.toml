translate = [
  "!*",
  "rwmutexMaxReaders",
  "RWMutex",
  "RWMutex.*",

  "WaitGroup",
  "WaitGroup.*",
  "waitGroupBubbleFlag",
  "noCopy",
  "rlocker",
  "rlocker.*",
  "Once",
  "Once.*",
  "Cond",
  "Cond.*",
  "NewCond",
  "Locker",

  "expunged",

  "init.0",
  "init.1",
]

imports = ["sync/atomic", "internal/race", "internal/synctest"]

axiomatize = ["notifyList"]

trusted = [
  # Unlike WaitGroup, one cannot translate and verify Mutex methods because they
  # actually have data races (and the race detector is explicitly disabled on
  # the sync package for these reasons).
  # E.g. in Mutex.Lock:
  # https://github.com/golang/go/blob/ff27d270c9f95178f9749bc8e1f15957b1c1d5b3/src/internal/sync/mutex.go#L100
  "Mutex",
  "Mutex.*",

  "runtime_notifyList*",

  # `copyChecker` is a `uintptr` holding its own address, and `check` converts
  # `unsafe.Pointer(c)` to `uintptr` and CASes it; goose supports neither, so
  # both are modeled in TrustedCode/sync.lean (as an `unsafe.Pointer`).
  "copyChecker",
  "copyChecker.*",

  "runtime_Semacquire*",
  "runtime_Semrelease",

  # a runtime linkname with no Go body
  "runtime_registerPoolCleanup",

  # `Pool.Get` and `Put` are modeled in TrustedCode/sync.lean with the Go model
  # goose/model/pool. With them and all their helpers (`pin`, `pinSlow`,
  # `getSlow`, `indexLocal`, `poolChain.*`, `poolDequeue.*`) in `translate`,
  # goose rejects only the runtime linknames with no Go body
  # (`runtime_procPin`, `runtime_procUnpin`, `runtime_LoadAcquintptr`,
  # `runtime_StoreReluintptr`), but what it translates is irreducible too:
  # `indexLocal` converts a `uintptr` back to an `unsafe.Pointer` (pointer
  # arithmetic, stuck in the semantics), `poolDequeue` stores an `any` through
  # `(*any)(unsafe.Pointer(slot))` of an `eface` (layout reinterpretation), and
  # the plain accesses to `l.private` are race-free only because `procPin`
  # keeps the goroutine on its P, which Go code cannot express.
  "Pool.Get",
  "Pool.Put",
]

# translate the definitions of all type declarations goose supports
translate_types = true
