# os is names-only, but for its package-level variable initializers and `init` (what importing os
# runs): the `errors.New` errors, `checkWrapErr`, `dirBufPool`'s `sync.Pool` literal, io/fs's error
# variables, `lstat = Lstat`, the `var _ fs.StatFS = dirFS("")` assertions, `checkPidfdOnce =
# sync.OnceValue(checkPidfd)`, `Interrupt`/`Kill` (`syscall.SIGINT`, `SIGKILL`), internal/poll's
# `ErrNoDeadline`/`ErrDeadlineExceeded` and `CopyFileRange`/`Splice` function values, and `init.0`
# (`Args = runtime_args()` unless `runtime.GOOS` is "windows", a constant goose emits as its value).
# Trusted models (TrustedCode/os.lean):
# * `runtime_args` (a `go:linkname` into the runtime, no Go body): an arbitrary `[]string`, a call
#   of `internal/gomodel.ChooseStrings`;
# * `Stdout`, `Stderr` (`NewFile(uintptr(syscall.Stdout), "/dev/stdout")`, ...): `Stdout` does
#   nothing (the variable is not allocated, code using it is stuck; it is to get a real model,
#   perennial#663), `Stderr` allocates its variable and stores a fresh pointer whose
#   memory is not a `File` (raft's logger stores `os.Stderr`; any use of the file is stuck). Not
#   translated by the user's decision (fix-semantics Case 33): `NewFile` reaches `Fcntl`, the
#   runtime poller and `SetFinalizer`.
# * `runtime_beforeExit` (a `go:linkname` into the runtime's `os_beforeExit`, which `Exit` calls):
#   nothing.
# `Exit` is translated, over `syscall.Exit` (TrustedCode/syscall.lean).
# `Stdin` is skipped (below).
translate = ["!*",
  "ErrProcessDone", "errProcessReleased", "ErrNoHandle",
  "errWriteAtInAppendMode", "errPathEscapes", "errPatternHasSeparator",
  "checkWrapErr", "dirBufPool",
  "ErrInvalid", "ErrPermission", "ErrExist", "ErrNotExist", "ErrClosed",
  "_", "lstat", "checkPidfdOnce",
  "Interrupt", "Kill",
  "ErrNoDeadline", "ErrDeadlineExceeded", "errNoDeadline", "errDeadlineExceeded",
  "pollCopyFileRange", "pollSplice",
  "Args", "init.0",
  "Exit",
]
trusted = ["runtime_args", "Stdout", "Stderr", "runtime_beforeExit"]

imports = ["!*", "errors", "sync", "io/fs", "syscall", "internal/poll", "internal/testlog"]

# translate the definitions of all type declarations goose supports
translate_types = true

[[skip]]
names = ["Stdin"]
reason = """
`NewFile(uintptr(syscall.Stdin), "/dev/stdin")` (file.go): `newFileFromNewFile` reads the
descriptor's flags (`unix.Fcntl(fd, syscall.F_GETFL, 0)`, a system call whose error it ignores)
and wraps the descriptor in a new `*File` (`newFile`: `pfd.Init`, the runtime poller's
`runtime_pollOpen` if the descriptor is non-blocking) with a finalizer: cannot panic, no effect
beyond the new `File` and the variable (the descriptor is the process's, open before `main`). Not translated by the user's decision (fix-semantics Case 33). Not read by
translated code."""
