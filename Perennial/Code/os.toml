# os is names-only, but for the package-level variable initializers whose callees are translated
# (the `errors.New` errors, `checkWrapErr`, `dirBufPool`'s `sync.Pool` literal). The other
# initializers call code Perennial does not translate (`io/fs`'s and `internal/poll`'s variables,
# `syscall`'s types, `NewFile`, `sync.OnceValue`, the runtime's `runtime_args`), and are
# axiomatized.
translate = ["!*",
  "ErrProcessDone", "errProcessReleased", "ErrNoHandle",
  "errWriteAtInAppendMode", "errPathEscapes", "errPatternHasSeparator",
  "checkWrapErr", "dirBufPool",
]

imports = ["!*", "errors", "sync"]

# translate the definitions of all type declarations goose supports
translate_types = true
