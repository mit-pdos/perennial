translate = [
  "Clone",
  "Equal",
  "ErrTooLarge",
  "errNegativeRead",
  "errUnreadByte",
  "asciiSpace",
  "NewBuffer",
  "Buffer.Read",
  "Buffer.empty",
  "Buffer.Reset",
  "Buffer.Write",
  "Buffer.WriteByte",
  "Buffer.Bytes",
  "Buffer.String",
  "Buffer.Len",
  "Buffer.grow",
  "Buffer.tryGrowByReslice",
  "growSlice",
  "smallBufferSize",
  "maxInt",
  "opInvalid",
  "opRead",
]
imports = ["!*", "errors", "io"]

# translate the definitions of all type declarations goose supports
translate_types = true

# `Compare` calls `internal/bytealg.Compare` (assembly): a Go model (goose/model/overlay/bytes).
[model]
dir = "goose/model/overlay/bytes"
replaces = ["Compare"]
