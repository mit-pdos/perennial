translate = [
  "Clone",
  "Equal",
  "ErrTooLarge",
  "errNegativeRead",
  "errUnreadByte",
  "asciiSpace",
]
# `Compare` calls `internal/bytealg.Compare` (assembly): a model in TrustedCode/bytes.lean.
trusted = ["Compare"]
