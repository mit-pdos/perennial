translate = [
  "Clone",
  "Equal",
  "ErrTooLarge",
  "errNegativeRead",
  "errUnreadByte",
  "asciiSpace",
  "NewBuffer",
  "Buffer.Read",
  "Buffer.empty",
  "Buffer.Reset",
  "Buffer.Write",
  "Buffer.Bytes",
  "Buffer.Len",
  "Buffer.grow",
  "Buffer.tryGrowByReslice",
  "growSlice",
  "smallBufferSize",
  "maxInt",
  "opInvalid",
  "opRead",
]
# `Compare` calls `internal/bytealg.Compare` (assembly): a model in TrustedCode/bytes.lean.
trusted = ["Compare"]
imports = ["!*", "errors", "io"]

# translate the definitions of all type declarations goose supports
translate_types = true
