# Everything but `clone`, a `go:linkname` to the runtime (`runtime/map.go`'s `maps_clone`) with no
# Go body, which goose rejects ("external function"). Its caller `Clone` is trusted instead
# (TrustedCode/maps.lean): `clone` takes and returns `any`, so a model of it alone would have to
# range over a map whose type is known only at run time, while the semantics' map operations
# (`map.forRange`, `IndexRef`) take a static type; `Clone`'s type parameters give it one.
translate = ["*", "!clone", "!Clone"]
trusted = ["Clone"]
imports = ["!*", "iter"]

# translate the definitions of all type declarations goose supports
translate_types = true
