# Everything but `clone`, a `go:linkname` to the runtime (`runtime/map.go`'s `maps_clone`) with no
# Go body, which goose rejects ("external function"). With only `clone` left out, goose translates
# `Clone` (`clone(m).(M)`), so `clone` is the innermost untranslatable unit; its caller `Clone` is
# trusted instead (TrustedCode/maps.lean, which says why: a model of `clone` itself needs a new
# semantics instruction, rejected for now).
translate = ["*", "!clone", "!Clone"]
trusted = ["Clone"]
imports = ["!*", "iter"]

# translate the definitions of all type declarations goose supports
translate_types = true
