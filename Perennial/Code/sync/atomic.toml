translate = [
  "Int64*",
  "Uint64*",
  "Int32*",
  "Uint32*",

  "Bool*",
  "b32",

  "align64",
  "efaceWords",

  "noCopy",
  "Pointer",
  "Pointer*",

  "_",
]

trusted = [
  "LoadUint64",
  "StoreUint64",
  "SwapUint64",
  "AddUint64",
  "CompareAndSwapUint64",

  "LoadInt64",
  "StoreInt64",
  "SwapInt64",
  "AddInt64",
  "CompareAndSwapInt64",

  "LoadUint32",
  "StoreUint32",
  "SwapUint32",
  "AddUint32",
  "CompareAndSwapUint32",

  "LoadInt32",
  "StoreInt32",
  "SwapInt32",
  "AddInt32",
  "CompareAndSwapInt32",

  "LoadPointer",
  "StorePointer",
  "SwapPointer",
  "CompareAndSwapPointer",

  # `Value`'s methods reinterpret the `any` field as two `unsafe.Pointer`s
  # (`efaceWords`), which goose cannot model; `Value` is modeled in
  # TrustedCode/sync/atomic.lean as an atomic cell holding an `any`.
  "Value",
  "Value.*",
]

imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
