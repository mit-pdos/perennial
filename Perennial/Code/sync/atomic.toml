translate = [
  "Int64*",
  "Uint64*",
  "Int32*",
  "Uint32*",

  "Bool*",
  "b32",

  "align64",
  "efaceWords",

  "noCopy",
  "Pointer",
  "Pointer*",

  "_",

  "Value",
]

trusted = [
  "LoadUint64",
  "StoreUint64",
  "SwapUint64",
  "AddUint64",
  "CompareAndSwapUint64",

  "LoadInt64",
  "StoreInt64",
  "SwapInt64",
  "AddInt64",
  "CompareAndSwapInt64",

  "LoadUint32",
  "StoreUint32",
  "SwapUint32",
  "AddUint32",
  "CompareAndSwapUint32",

  "LoadInt32",
  "StoreInt32",
  "SwapInt32",
  "AddInt32",
  "CompareAndSwapInt32",

  "LoadPointer",
  "StorePointer",
  "SwapPointer",
  "CompareAndSwapPointer",

  # `Value`'s methods call `runtime_procPin`/`runtime_procUnpin` (external
  # functions, which goose rejects) and reinterpret the `any` field as two
  # `unsafe.Pointer` words (`efaceWords`), a memory layout the semantics does
  # not have (an interface is one value). They are modeled in
  # TrustedCode/sync/atomic.lean as atomic operations on the field `v`.
  "Value.*",
]

imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
