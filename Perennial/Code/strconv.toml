# ParseUint over internal/strconv's, and the errors it returns
translate = [
  "ParseUint", "toError", "syntaxError", "rangeError", "baseError", "bitSizeError", "ErrRange",
  "ErrSyntax", "NumError", "NumError.Unwrap",
  "ParseBool", "FormatBool",
  "FormatUint", "FormatInt", "Itoa", "ParseInt",
  # `Atoi`, over `internal/strconv`'s
  "Atoi",
  # quoting (quote.go): `Quote` and `AppendQuote` over `appendQuotedWith`, `IsPrint` and its tables
  "Quote", "AppendQuote", "quoteWith", "appendQuotedWith", "appendEscapedRune", "lowerhex",
  "IsPrint", "bsearch", "isPrint16", "isNotPrint16", "isPrint32", "isNotPrint32",
]
imports = ["!*", "errors", "internal/strconv", "internal/stringslite", "unicode/utf8"]


# translate the definitions of all type declarations goose supports
translate_types = true

[[skip]]
names = ["isGraphic"]
reason = """
The graphic-rune table (isprint.go): a slice literal of constants, so the initializer allocates
and stores constants, cannot panic and has no effect beyond the variable. Read only by
`isInGraphicList` (quote.go), which is not translated (the translated quoting functions call it
only with `graphicOnly` set, which `Quote` and `AppendQuote` never pass)."""
