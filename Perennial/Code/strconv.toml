# ParseUint over internal/strconv's, and the errors it returns
translate = [
  "ParseUint", "toError", "syntaxError", "rangeError", "baseError", "bitSizeError", "ErrRange",
  "ErrSyntax", "NumError", "NumError.Unwrap",
  "ParseBool", "FormatBool",
  "FormatUint", "FormatInt", "Itoa", "ParseInt",
  # `Atoi`, over `internal/strconv`'s
  "Atoi",
]
imports = ["!*", "errors", "internal/strconv", "internal/stringslite"]


# translate the definitions of all type declarations goose supports
translate_types = true

[[skip]]
names = ["isPrint16", "isNotPrint16", "isPrint32", "isNotPrint32", "isGraphic"]
reason = """
The printable-rune tables (isprint.go): slice literals of constants, so the initializers
allocate and store constants, cannot panic and have no effect beyond the variables. Read only by
`IsPrint` and `isInGraphicList` (quote.go), which `IsGraphic` and the quoting functions call;
none of them is translated."""
