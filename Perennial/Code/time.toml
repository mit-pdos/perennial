imports = ["!*"]
trusted = [
  # TODO: these are for verifying (rather than modeling) `After`, but the proof
  # would be blocked by the lack of support for type assertions (needed in time.sendTime)
  "runtimeNano", # go:linkname runtimeNano
  "newTimer",    # go:linkname newTimer
  "syncTimer",
  "runtimeIsBubbled", # go:linkname runtimeIsBubbled (true only inside a synctest bubble)
  # "sendTime",

  "After",
  "Sleep",
]
translate = [
  "Time",
  "Duration",
  "Second",
  "Minute",
  "Hour",
  "Millisecond",
  "Microsecond",
  "Nanosecond",
  "Timer",
  "Time.UnixNano",
  "Time.nsec",
  "Time.unixSec",
  "Time.sec",
  "Time.Add",
  "Time.addSec",
  "Time.stripMono",
  "Time.Sub",
  "Time.Before",
  "Time.Equal",
  "subMono",
  "minDuration",
  "maxDuration",
  "Since",
  "Until",
  "wallToInternal",
  "nsecMask",
  "nsecShift",
  "hasMonotonic",
  "internalToUnix",
]

# translate the definitions of all type declarations goose supports
translate_types = true
