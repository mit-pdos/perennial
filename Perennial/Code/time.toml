imports = ["!*", "errors"]
trusted = [
  # TODO: these are for verifying (rather than modeling) `After`, but the proof
  # would be blocked by the lack of support for type assertions (needed in time.sendTime)
  "runtimeNano", # go:linkname runtimeNano
  "newTimer",    # go:linkname newTimer
  "syncTimer",
  "runtimeIsBubbled", # go:linkname runtimeIsBubbled (true only inside a synctest bubble)
  # "sendTime",

  "After",
  "Sleep",

  # `NewTicker` and the `*Ticker` methods convert the runtime's `*Timer` to and from `*Ticker`
  # through `unsafe.Pointer` (the two structs share a prefix): modeled in TrustedCode/time.lean
  "NewTicker",
  "Ticker.Stop",
  "Ticker.Reset",

  # `asynctimerchan = godebug.New(...)`: `internal/godebug` is not translated
  # (TrustedCode/time.lean)
  "asynctimerchan",
]
translate = [
  "Time",
  "Duration",
  "Second",
  "Minute",
  "Hour",
  "Millisecond",
  "Microsecond",
  "Nanosecond",
  "Timer",
  "Time.UnixNano",
  "Time.nsec",
  "Time.unixSec",
  "Time.sec",
  "Time.Add",
  "Time.addSec",
  "Time.stripMono",
  "Time.Sub",
  "Time.Before",
  "Time.After",
  "Time.Equal",
  "subMono",
  "minDuration",
  "maxDuration",
  "Since",
  "Until",
  "AfterFunc",
  "when",
  "goFunc",
  "wallToInternal",
  "nsecMask",
  "nsecShift",
  "hasMonotonic",
  "internalToUnix",

  # the package variables, all but `asynctimerchan`, and the constants `std0x` uses
  "std0x", "longDayNames", "shortDayNames", "shortMonthNames", "longMonthNames",
  "errAtoi", "errBad", "errLeadingInt", "unitMap", "startNano", "UTC", "utcLoc",
  "Local", "localLoc", "errLocation", "errBadData", "platformZoneSources",
  "stdZeroMonth", "stdZeroDay", "stdZeroHour12", "stdZeroMinute", "stdZeroSecond",
  "stdYear",
]

# translate the definitions of all type declarations goose supports
translate_types = true
