imports = ["!*"]
trusted = [
  # TODO: these are for verifying (rather than modeling) `After`, but the proof
  # would be blocked by the lack of support for type assertions (needed in time.sendTime)
  "runtimeNano", # go:linkname runtimeNano
  "newTimer",    # go:linkname newTimer
  "syncTimer",
  # "sendTime",

  "After",
  "Sleep",
]
translate = [
  "Time",
  "Duration",
  "Second",
  "Minute",
  "Hour",
  "Millisecond",
  "Microsecond",
  "Nanosecond",
  "Timer",
  "Time.UnixNano",
  "Time.nsec",
  "Time.unixSec",
  "Time.sec",
  # for `ptr_Add_unfold` (`(*Time).Add`); `Time.wp_Add` stays an axiom: the body uses `&^`,
  # which Go's semantics here does not define, and calls the untranslated `addSec`, `stripMono`
  "Time.Add",
  "wallToInternal",
  "nsecMask",
  "hasMonotonic",
  "internalToUnix",
]

# translate the definitions of all type declarations goose supports
translate_types = true
