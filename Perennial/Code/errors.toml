translate = [
  "!*",
  "Unwrap",
  "New",
  "AsType",
  "asType",
  "errorString*",
  "ErrUnsupported",
  "is",
  "Join",
  "As",
  "as",
  "errorType",
]

imports = ["!*", "internal/reflectlite"]

# translate the definitions of all type declarations goose supports
translate_types = true

# `Is` calls `reflectlite.TypeOf(target).Comparable()`, which the model of internal/reflectlite
# does not model: a Go model (goose/model/overlay/errors) with that call replaced by `true`
# (documented there: the model is stuck where Go skips comparing an uncomparable target).
[model]
dir = "goose/model/overlay/errors"
replaces = ["Is"]
