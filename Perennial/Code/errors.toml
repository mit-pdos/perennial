translate = [
  "!*",
  "Unwrap",
  "New",
  "AsType",
  "asType",
  "errorString*",
  "ErrUnsupported",
  "is",
]
# `Is` calls `reflectlite.TypeOf(target).Comparable()` (`internal/reflectlite` is not
# translated): a model in TrustedCode/errors.lean, with that call replaced by `true`
# (documented there: the model is stuck where Go skips comparing an uncomparable target).
trusted = ["Is"]
imports = ["!*"]

# translate the definitions of all type declarations goose supports
translate_types = true
