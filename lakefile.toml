name = "perennial"
defaultTargets = ["Perennial"]

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean"
rev = "6d6544a4394c1f89ce43b26a35f09de9b2158bc9"
subDir = "Iris"

# Perennial's goose framework and program proofs, on top of iris-lean.
[[lean_lib]]
name = "Perennial"

[leanOptions]
linter.unusedSectionVars = false

# The proof automation (tactics, elaborators, notation, simprocs) and its import
# closure, compiled to native code (-O0: C compile time is on the critical path).
# Declared after `Perennial`, so that lake takes these modules from here. The
# list is generated: rerun etc/meta-lib.py (which explains the setup) after
# changing a tactic module or its imports.
[[lean_lib]]
name = "PerennialMeta"
roots = ["PerennialMeta"]
precompileModules = true
moreLeancArgs = ["-O0"]
