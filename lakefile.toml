name = "perennial"
defaultTargets = ["Perennial"]

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean"
rev = "6d6544a4394c1f89ce43b26a35f09de9b2158bc9"
subDir = "Iris"

# Port of Perennial's new-goose framework (Rocq `new/` plus the parts of `src/`
# it depends on) to Lean, on top of iris-lean.
[[lean_lib]]
name = "Perennial"

[leanOptions]
linter.unusedSectionVars = false
