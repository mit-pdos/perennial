name = "perennial"
defaultTargets = ["Perennial"]

# iris-lean with transfinite step indices: the local checkout at ../iris-lean
# (branch agent/sidx-ordn; step index Ordinals.Ordinal.{3}).
[[require]]
name = "iris"
path = "../iris-lean/Iris"

# Perennial's goose framework and program proofs, on top of iris-lean.
[[lean_lib]]
name = "Perennial"

[leanOptions]
linter.unusedSectionVars = false
