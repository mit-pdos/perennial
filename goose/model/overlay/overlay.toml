# Go models of standard-library files (the trust ladder's "a Go model under goose/model"): each
# entry replaces whole files of a standard-library package by the files of the same name in
# goose/model/overlay/<path>/, when goose translates the standard library
# (etc/update-goose-new.py --std-lib passes the overlay that etc/model-overlay.py builds from this
# file to goose, proofgen, skiplint and modelcheck). A stopgap for the declaration-level `[model]`
# tables of perennial#692's plan (S0): an entry here is the special case where the replaced
# declarations are all the declarations of a file.
#
# Each entry:
#   path     the package's import path (a directory of $GOROOT/src);
#   replace  the files of the package replaced (each model file declares exactly the declarations
#            of the real file, with the same signatures: etc/model-overlay.py --check);
#   asm      for the difftest only: the assembly files that define the replaced bodyless
#            functions on linux/amd64, replaced by an empty file so that the package builds with
#            the models' Go bodies instead;
#   tests    the packages whose own tests are the difftest: `etc/model-overlay.py test` runs them
#            (`go test -overlay`) on the real standard library with the models in place.

[[package]]
path = "internal/bytealg"
# `IndexByte`/`IndexByteString` and `Index`/`IndexString`: bodyless declarations whose bodies are
# assembly on amd64 (indexbyte_amd64.s, index_amd64.s); `strings.IndexByte`, `strings.Index` and
# `strings.Cut` reach them.
replace = ["indexbyte_native.go", "index_native.go"]
asm = ["indexbyte_amd64.s", "index_amd64.s"]
tests = ["strings", "bytes"]
